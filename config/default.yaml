engine:
  mode: live
  universe: sp500
  max_positions: 20
  capital: 10_000
  session_start: "09:30"
  session_end: "16:00"
  timezone: America/New_York

broker:
  primary: robinhood
  fallback: alpaca

chain:
  enabled: true
  rpc: https://rpc.mainnet.chain.robinhood.com
  chain_id: 4663
  confirm_blocks: 2
  gas_limit: 300000

sentiment:
  enabled: true
  config: config/sentiment.yaml

data:
  provider: robinhood_chain
  cache_backend: redis
  bar_window_days: 5

monitoring:
  prometheus_port: 8000
  log_level: INFO
