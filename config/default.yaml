engine:
  mode: paper
  universe: sp500
  rebalance: daily
  max_positions: 40
  capital: 1_000_000
  session_start: "09:30"
  session_end: "16:00"
  timezone: America/New_York

data:
  provider: robinhood_chain
  cache_ttl: 300
  bar_size: 1m
  lookback_days: 5

broker:
  primary: alpaca
  fallback: ibkr

chain:
  enabled: true
  rpc: https://rpc.mainnet.chain.robinhood.com
  chain_id: 4663
  confirm_blocks: 2
  gas_limit: 300000

logging:
  level: INFO
  format: json
  file: logs/pickles.log
